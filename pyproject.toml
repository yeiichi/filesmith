[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "filesmith"
version = "0.5.0"
description = "A collection of file manipulation and inspection utilities, including pattern-based file operations."
authors = [
    { name = "Eiichi YAMAMOTO", email = "info@yeiichi.com" },
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "smith-utils>=0.3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]
docs = [
    "furo>=2024.8.6",
    "sphinx>=8,<9",
]

[project.scripts]
filesmith = "filesmith.cli:main"
filesmith-legacy = "filesmith.core:main"
filesmith-find-move = "filesmith.cli_findmove:main"
filesmith-knapsack = "filesmith.cli_knapsack:main"
filesmith-duplicates = "filesmith.cli_duplicates:main"

[project.urls]
Homepage = "https://github.com/yeiichi/filesmith"
Repository = "https://github.com/yeiichi/filesmith.git"
Issues = "https://github.com/yeiichi/filesmith/issues"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["filesmith*"]

[tool.semantic_release]
allow_zero_version = true
version_toml = ["pyproject.toml:project.version"]
